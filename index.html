<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTML PDF API</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="page">
      <section class="card">
        <p class="eyebrow">HTML to PDF Converter</p>
        <h1>High-quality browser PDF conversion</h1>
        <p class="intro">
          Paste HTML, enter your API key, and generate a PDF. This page is only a testing UI;
          your real app should call <code>/api/html-to-pdf</code>.
        </p>

        <label>
          API Key
          <input id="apiKey" type="password" placeholder="Enter your Render PDF_API_KEY" />
        </label>

        <label>
          Filename
          <input id="filename" type="text" value="test-document.pdf" />
        </label>

        <div class="grid">
          <label>
            Page size
            <select id="format">
              <option>A4</option>
              <option>A3</option>
              <option>A5</option>
              <option>Letter</option>
              <option>Legal</option>
            </select>
          </label>

          <label>
            Orientation
            <select id="orientation">
              <option value="portrait">Portrait</option>
              <option value="landscape">Landscape</option>
            </select>
          </label>
        </div>

        <label>
          HTML
          <textarea id="htmlInput" spellcheck="false"></textarea>
        </label>

        <button id="convertBtn">Convert to PDF</button>

        <p id="status" class="status"></p>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
